<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title desc"><title id="title">正常路径与错误路径</title><desc id="desc">输入经过校验，正常时返回计算结果，非法时 error 交给 catch；无论处理成功还是失败，文件通道都需要关闭。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#167d8d"/></marker></defs><rect width="900" height="360" rx="16" fill="#f6f2e9"/><style>text{font-family:system-ui,sans-serif;fill:#24343b}.h{font-size:23px;font-weight:700}.t{font-size:17px}.s{font-size:15px}.b{fill:#e0f0ee;stroke:#167d8d;stroke-width:2}.o{fill:#fff0da;stroke:#c98225;stroke-width:2}.a{stroke:#167d8d;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style><text x="30" y="38" class="h">正常路径与错误路径</text><rect class="b" x="30" y="122" width="170" height="80" rx="10"/><text class="t" x="62" y="168">输入与文件</text><path class="a" d="M210 162H269"/><path d="M360 98L440 162L360 226L280 162Z" class="b"/><text class="t" x="328" y="168">校验</text><path class="a" d="M405 126L492 85H551"/><text class="s" x="456" y="103">正常</text><path class="a" d="M405 202L492 255H551"/><text class="s" x="456" y="244">非法</text><rect class="b" x="566" y="52" width="270" height="75" rx="10"/><text class="t" x="588" y="85">return 结果</text><text class="s" x="588" y="109">catch 状态 0</text><rect class="o" x="566" y="216" width="270" height="75" rx="10"/><text class="t" x="588" y="249">error 原因 → catch</text><text class="s" x="588" y="274">状态 1；显示原因或继续报错</text><text class="s" x="305" y="304">已打开通道：两条路径都要 close</text><text x="30" y="340" class="s">教材示意 · 运行后的真实数据请看页面结果视图</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title desc"><title id="title">文件内容、读取位置与输出摘要</title><desc id="desc">gets 每次读取一行并前进，read 读取剩余部分；三条数值求平均后写入 summary.txt，关闭通道使内容完成写入。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#167d8d"/></marker></defs><rect width="900" height="360" rx="16" fill="#f6f2e9"/><style>text{font-family:system-ui,sans-serif;fill:#24343b}.h{font-size:23px;font-weight:700}.t{font-size:17px}.s{font-size:15px}.b{fill:#e0f0ee;stroke:#167d8d;stroke-width:2}.o{fill:#fff0da;stroke:#c98225;stroke-width:2}.a{stroke:#167d8d;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style><text x="30" y="38" class="h">文件内容、读取位置与输出摘要</text><rect class="b" x="30" y="70" width="220" height="215" rx="10"/><text class="t" x="48" y="105">readings.txt（虚拟）</text><text class="t" x="64" y="150">1.2</text><text class="t" x="64" y="190">1.4</text><text class="t" x="64" y="230">1.6</text><path class="a" d="M42 182H58"/><text class="s" x="116" y="192">当前读取行</text><path class="a" d="M260 176H315"/><rect class="b" x="330" y="96" width="240" height="160" rx="10"/><text class="t" x="348" y="130">通道 → 计算</text><text class="s" x="348" y="168">数量 = 3</text><text class="s" x="348" y="205">总和 4.2 ÷ 3 = 1.4</text><path class="a" d="M580 176H635"/><rect class="o" x="650" y="96" width="220" height="160" rx="10"/><text class="t" x="668" y="130">summary.txt</text><text class="s" x="668" y="168">数量：3</text><text class="s" x="668" y="205">平均值：1.40</text><text class="s" x="330" y="294">open → 读 / 写 → close；不访问电脑真实磁盘</text><text x="30" y="340" class="s">教材示意 · 运行后的真实数据请看页面结果视图</text></svg>
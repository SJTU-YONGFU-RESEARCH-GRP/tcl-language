<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">一条命令怎样形成一行通知</title><desc id="desc">puts 是命令名，双引号中的活动文字是一个参数。解释器执行命令，在输出通道中写下一行文字。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#276960"/></marker></defs><rect width="800" height="360" rx="16" fill="#faf7ef"/><g font-family="system-ui, sans-serif" fill="#243c38"><text x="28" y="36" font-size="21" font-weight="700">一条命令怎样形成一行通知</text><rect x="30" y="78" width="710" height="75" rx="9" fill="#e3eeea" stroke="#a9c3b9"/><text x="55" y="121" font-size="24">puts</text><text x="164" y="121" font-size="24">&quot;活动：周末读书会&quot;</text><path d="M83 160 L83 210" stroke="#276960" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M356 160 L356 210" stroke="#276960" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="43" y="236" font-size="17">命令名称</text><text x="268" y="236" font-size="17">一个文字参数</text><rect x="500" y="212" width="245" height="74" rx="9" fill="#fff0d9" stroke="#a9c3b9"/><text x="520" y="243" font-size="17">标准输出</text><text x="520" y="270" font-size="17">活动：周末读书会</text><path d="M415 228 L492 228" stroke="#276960" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="40" y="323" font-size="17">空白分隔词；引号中的空格仍属于同一参数。</text></g></svg>

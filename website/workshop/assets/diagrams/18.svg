<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title desc"><title id="title">输入文件 → 解析 → 统计 → 输出报告</title><desc id="desc">morning.rpt 和 evening.rpt 经逐文件校验形成有效字典记录，坏报告进入单独错误列表；统计数量、负 slack 与最差值，输出标注完整或部分的摘要。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#167d8d"/></marker></defs><rect width="900" height="360" rx="16" fill="#f6f2e9"/><style>text{font-family:system-ui,sans-serif;fill:#24343b}.h{font-size:23px;font-weight:700}.t{font-size:17px}.s{font-size:15px}.b{fill:#e0f0ee;stroke:#167d8d;stroke-width:2}.o{fill:#fff0da;stroke:#c98225;stroke-width:2}.a{stroke:#167d8d;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style><text x="30" y="38" class="h">输入文件 → 解析 → 统计 → 输出报告</text><rect class="b" x="25" y="90" width="175" height="175" rx="10"/><text class="t" x="43" y="124">输入文件</text><text class="s" x="43" y="166">morning.rpt</text><text class="s" x="43" y="195">evening.rpt</text><text class="s" x="43" y="224">bad.rpt</text><path class="a" d="M208 176H237"/><rect class="b" x="250" y="90" width="175" height="175" rx="10"/><text class="t" x="268" y="124">解析与校验</text><text class="s" x="268" y="166">source、line</text><text class="s" x="268" y="195">path、delay、slack</text><text class="s" x="268" y="224">整份成功才入统计</text><path class="a" d="M433 176H462"/><rect class="b" x="475" y="90" width="175" height="175" rx="10"/><text class="t" x="493" y="124">有效记录统计</text><text class="s" x="493" y="166">count = 4</text><text class="s" x="493" y="195">negative = 2</text><text class="s" x="493" y="224">worst = −1.2 ns</text><path class="a" d="M658 176H687"/><rect class="o" x="700" y="90" width="175" height="175" rx="10"/><text class="t" x="718" y="124">摘要与错误清单</text><text class="s" x="718" y="166">analysis.txt</text><text class="s" x="718" y="195">errors.txt</text><text class="s" x="718" y="224">标记：完整 / 部分</text><path class="a" d="M337 269V294H786V272"/><text class="s" x="363" y="313">失败报告 → issues（包含文件名与行号）</text><text x="30" y="340" class="s">教材示意 · 运行后的真实数据请看页面结果视图</text></svg>
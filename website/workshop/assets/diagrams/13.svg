<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title desc"><title id="title">同名变量在不同作用域中各自存在</title><desc id="desc">全局 total 为 999，命名空间 ledger 的 total 为 20，过程的 amount 为 8；variable 绑定 ledger 状态，global 才绑定全局状态。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#167d8d"/></marker></defs><rect width="900" height="360" rx="16" fill="#f6f2e9"/><style>text{font-family:system-ui,sans-serif;fill:#24343b}.h{font-size:23px;font-weight:700}.t{font-size:17px}.s{font-size:15px}.b{fill:#e0f0ee;stroke:#167d8d;stroke-width:2}.o{fill:#fff0da;stroke:#c98225;stroke-width:2}.a{stroke:#167d8d;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style><text x="30" y="38" class="h">同名变量在不同作用域中各自存在</text><rect class="o" x="30" y="75" width="230" height="205" rx="10"/><text class="t" x="50" y="112">全局 ::</text><text class="t" x="50" y="156">total = 999</text><text class="s" x="50" y="217">global total 指向这里</text><rect class="b" x="310" y="75" width="560" height="205" rx="10"/><text class="t" x="332" y="112">命名空间 ::ledger</text><text class="t" x="332" y="156">total = 20</text><rect x="555" y="125" width="290" height="126" rx="8" fill="#fff" stroke="#167d8d"/><text class="t" x="573" y="159">add 的本次调用</text><text class="s" x="573" y="190">局部 amount = 8</text><text class="s" x="573" y="221">variable total → 共享状态</text><path class="a" d="M550 210L472 164"/><text class="s" x="310" y="308">完整命令名 ::ledger::add；状态与 ::total 分开</text><text x="30" y="340" class="s">教材示意 · 运行后的真实数据请看页面结果视图</text></svg>
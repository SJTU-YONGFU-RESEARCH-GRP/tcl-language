<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title desc"><title id="title">Tcl 语言 + 工具提供的业务命令</title><desc id="desc">真实 EDA 宿主可以向 Tcl 提供设计数据库查询；本课程仅用自编 demoeda 过程查询 name、kind、area 字典列表，没有商业工具连接。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#167d8d"/></marker></defs><rect width="900" height="360" rx="16" fill="#f6f2e9"/><style>text{font-family:system-ui,sans-serif;fill:#24343b}.h{font-size:23px;font-weight:700}.t{font-size:17px}.s{font-size:15px}.b{fill:#e0f0ee;stroke:#167d8d;stroke-width:2}.o{fill:#fff0da;stroke:#c98225;stroke-width:2}.a{stroke:#167d8d;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style><text x="30" y="38" class="h">Tcl 语言 + 工具提供的业务命令</text><rect class="b" x="30" y="75" width="240" height="215" rx="10"/><text class="t" x="50" y="111">真实 Tcl 解释器</text><text class="s" x="50" y="153">set / if / foreach</text><text class="s" x="50" y="186">dict / proc / string</text><text class="s" x="50" y="244">负责语言执行</text><path class="a" d="M280 176H320"/><rect class="b" x="335" y="75" width="260" height="215" rx="10"/><text class="t" x="353" y="111">自写 ::demoeda</text><text class="s" x="353" y="154">get_cells {pattern}</text><text class="s" x="353" y="188">遍历 + string match</text><text class="s" x="353" y="244">源代码完整可见</text><path class="a" d="M605 176H645"/><rect class="o" x="660" y="75" width="210" height="215" rx="10"/><text class="t" x="678" y="111">原创教学记录</text><text class="s" x="678" y="153">U_AND · AND2 · 1.2</text><text class="s" x="678" y="188">U_BUF · BUF · 0.5</text><text class="s" x="678" y="244">没有真实设计数据库</text><text x="30" y="340" class="s">教材示意 · 运行后的真实数据请看页面结果视图</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title desc"><title id="title">一个类，两台独立仪器</title><desc id="desc">Meter 类定义 add、values 方法；实例 A 保存 1.2 和 1.5，实例 B 保存 8，每个实例的 readings 独立，destroy 销毁对应实例命令。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#167d8d"/></marker></defs><rect width="900" height="360" rx="16" fill="#f6f2e9"/><style>text{font-family:system-ui,sans-serif;fill:#24343b}.h{font-size:23px;font-weight:700}.t{font-size:17px}.s{font-size:15px}.b{fill:#e0f0ee;stroke:#167d8d;stroke-width:2}.o{fill:#fff0da;stroke:#c98225;stroke-width:2}.a{stroke:#167d8d;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style><text x="30" y="38" class="h">一个类，两台独立仪器</text><rect class="b" x="30" y="88" width="270" height="190" rx="10"/><text class="t" x="52" y="122">Meter 类：行为规则</text><text class="s" x="52" y="159">constructor：初始化记录</text><text class="s" x="52" y="195">method add：追加数值</text><text class="s" x="52" y="231">method values：返回记录</text><path class="a" d="M312 135H374"/><path class="a" d="M312 230H374"/><rect class="b" x="390" y="70" width="470" height="100" rx="10"/><text class="t" x="412" y="105">实例 A</text><text class="s" x="412" y="138">对象 readings = {1.2 1.5}</text><rect class="o" x="390" y="205" width="470" height="100" rx="10"/><text class="t" x="412" y="240">实例 B</text><text class="s" x="412" y="273">对象 readings = {8} · destroy 只销毁这一台</text><text x="30" y="340" class="s">教材示意 · 运行后的真实数据请看页面结果视图</text></svg>
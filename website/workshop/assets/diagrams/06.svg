<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">一个姓名对应一个列表元素</title><desc id="desc">三个元素林雨、Chen Ming、赵安分别拥有索引零一二。姓名内部的空格不切开元素，list 保证元素边界。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#276960"/></marker></defs><rect width="800" height="360" rx="16" fill="#faf7ef"/><g font-family="system-ui, sans-serif" fill="#243c38"><text x="28" y="36" font-size="21" font-weight="700">一个姓名对应一个列表元素</text><text x="35" y="90" font-size="22">list &quot;林 雨&quot; &quot;Chen Ming&quot; 赵安</text><path d="M382 104 L382 155" stroke="#276960" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="33" y="172" width="230" height="90" rx="9" fill="#e3eeea" stroke="#a9c3b9"/><text x="53" y="205" font-size="17">索引 0</text><text x="53" y="242" font-size="23">林 雨</text><rect x="283" y="172" width="230" height="90" rx="9" fill="#e3eeea" stroke="#a9c3b9"/><text x="303" y="205" font-size="17">索引 1</text><text x="303" y="242" font-size="23">Chen Ming</text><rect x="533" y="172" width="230" height="90" rx="9" fill="#e3eeea" stroke="#a9c3b9"/><text x="553" y="205" font-size="17">索引 2 / end</text><text x="553" y="242" font-size="23">赵安</text><text x="35" y="305" font-size="18">llength = 3；lindex $names 1 = Chen Ming</text><text x="35" y="334" font-size="16">花括号和转义属于列表的表示方式，通常不是姓名内容。</text></g></svg>

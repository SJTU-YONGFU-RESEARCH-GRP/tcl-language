<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">文本清理保留原值，返回新值</title><desc id="desc">原始地址两端有空格并使用大写。先 trim 去掉两端空格，再 tolower 转为小写，得到规范地址；姓名内部空格不会被 trim 删除。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#276960"/></marker></defs><rect width="800" height="360" rx="16" fill="#faf7ef"/><g font-family="system-ui, sans-serif" fill="#243c38"><text x="28" y="36" font-size="21" font-weight="700">文本清理保留原值，返回新值</text><rect x="35" y="74" width="728" height="65" rx="9" fill="#fff0d9" stroke="#a9c3b9"/><text x="53" y="101" font-size="17">原始 raw</text><text x="209" y="115" font-size="21">␣␣LI.MING@EXAMPLE.ORG␣␣</text><path d="M398 147 L398 188" stroke="#276960" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="476" y="171" font-size="16">trim：只去两端空白</text><rect x="35" y="196" width="728" height="65" rx="9" fill="#e3eeea" stroke="#a9c3b9"/><text x="53" y="223" font-size="17">清理 email</text><text x="209" y="237" font-size="21">li.ming@example.org</text><text x="477" y="192" font-size="16">tolower：统一小写</text><text x="35" y="306" font-size="18">raw 保持原样；email 保存新的返回值。</text><text x="35" y="335" font-size="16">对照：&quot;  林 雨  &quot; → &quot;林 雨&quot;；内部空格保留。</text></g></svg>

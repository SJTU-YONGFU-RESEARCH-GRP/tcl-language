<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">循环逐行累计有效测量</title><desc id="desc">五条读数依次处理，十八和二十一累计，负一被 continue 跳过，随后十九与二十三继续累计，最终次数四总和八十一。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#276960"/></marker></defs><rect width="800" height="360" rx="16" fill="#faf7ef"/><g font-family="system-ui, sans-serif" fill="#243c38"><text x="28" y="36" font-size="21" font-weight="700">循环逐行累计有效测量</text><rect x="35" y="68" width="427" height="226" rx="9" fill="#e3eeea" stroke="#a9c3b9"/><text x="54" y="99" font-size="17">读数          动作           count / total</text><text x="54" y="134" font-size="17">18             累计                1 / 18</text><text x="54" y="170" font-size="17">21             累计                2 / 39</text><rect x="46" y="185" width="405" height="33" rx="9" fill="#fff0d9" stroke="#a9c3b9"/><text x="54" y="208" font-size="17">-1             continue          2 / 39</text><text x="54" y="244" font-size="17">19             累计                3 / 58</text><text x="54" y="279" font-size="17">23             累计                4 / 81</text><path d="M472 250 L518 250" stroke="#276960" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="531" y="205" width="228" height="84" rx="9" fill="#e3eeea" stroke="#a9c3b9"/><text x="550" y="240" font-size="17">有效次数：4</text><text x="550" y="271" font-size="17">有效总和：81</text><text x="37" y="326" font-size="16">跳过当前项后仍处理后面的读数；break 则会直接结束循环。</text></g></svg>

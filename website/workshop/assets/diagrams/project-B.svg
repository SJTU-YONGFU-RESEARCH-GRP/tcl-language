<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="900" height="450" role="img" aria-labelledby="title desc">
<title id="title">开支分流后汇总</title><desc id="desc">合法整数分按类别汇总，负金额保留错误序号并拒绝。金额只在输出时换算为元。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#217c72"/></marker></defs>
<rect width="900" height="450" rx="18" fill="#f8f5ed"/>
<g font-family="system-ui, 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif">
<text x="28" y="43" font-size="25" font-weight="650" fill="#263b38" text-anchor="start">项目 B · 开支分流后汇总</text>
<text x="28" y="73" font-size="14" font-weight="400" fill="#217c72" text-anchor="start">教材示意 · Static teaching diagram</text>
<rect x="28" y="112" width="230" height="222" rx="12" fill="#fffdf7" stroke="#c4d5ca"/><text x="46" y="142" font-size="20" font-weight="600" fill="#263b38" text-anchor="start">输入记录 / 分</text><text x="46" y="177" font-size="18" font-weight="400" fill="#263b38" text-anchor="start">餐食: 1850</text><text x="46" y="209" font-size="18" font-weight="400" fill="#263b38" text-anchor="start">交通: 320</text><text x="46" y="241" font-size="18" font-weight="400" fill="#263b38" text-anchor="start">餐食: 650</text><text x="46" y="273" font-size="18" font-weight="400" fill="#263b38" text-anchor="start">日用: -100</text><path d="M268,192 L309,192" stroke="#217c72" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="320" y="112" width="252" height="142" rx="12" fill="#e2f1eb" stroke="#c4d5ca"/><text x="338" y="142" font-size="20" font-weight="600" fill="#263b38" text-anchor="start">合法数据按类别累加</text><text x="338" y="177" font-size="18" font-weight="400" fill="#263b38" text-anchor="start">餐食: 1850 + 650</text><text x="338" y="209" font-size="18" font-weight="400" fill="#263b38" text-anchor="start">交通: 320</text><path d="M581,181 L620,181" stroke="#217c72" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="632" y="112" width="240" height="142" rx="12" fill="#e2f1eb" stroke="#c4d5ca"/><text x="650" y="142" font-size="20" font-weight="600" fill="#263b38" text-anchor="start">摘要 / 元</text><text x="650" y="177" font-size="18" font-weight="400" fill="#263b38" text-anchor="start">餐食: 25.00</text><text x="650" y="209" font-size="18" font-weight="400" fill="#263b38" text-anchor="start">交通: 3.20</text><path d="M268,300 L309,300" stroke="#217c72" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="320" y="275" width="252" height="94" rx="12" fill="#ffecd8" stroke="#c4d5ca"/><text x="338" y="305" font-size="20" font-weight="600" fill="#263b38" text-anchor="start">拒绝记录</text><text x="338" y="340" font-size="18" font-weight="400" fill="#263b38" text-anchor="start">记录 4: 金额为负</text><rect x="632" y="275" width="240" height="94" rx="12" fill="#fffdf7" stroke="#c4d5ca"/><text x="650" y="305" font-size="20" font-weight="600" fill="#263b38" text-anchor="start">总额</text><text x="650" y="340" font-size="18" font-weight="400" fill="#263b38" text-anchor="start">28.20 元</text>
<text x="28" y="422" font-size="15" font-weight="400" fill="#263b38" text-anchor="start">错误记录不进入总额；整数分用于计算，format 用于显示。</text>

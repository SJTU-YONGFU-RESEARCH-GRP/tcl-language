<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="900" height="450" role="img" aria-labelledby="title desc">
<title id="title">姓名是一个列表元素</title><desc id="desc">完整姓名保持为一个列表元素。首尾清理、空白归一化、删除空项、区分大小写去重、字典排序后，两个不同姓名留下。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#217c72"/></marker></defs>
<rect width="900" height="450" rx="18" fill="#f8f5ed"/>
<g font-family="system-ui, 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif">
<text x="28" y="43" font-size="25" font-weight="650" fill="#263b38" text-anchor="start">项目 A · 姓名是一个列表元素</text>
<text x="28" y="73" font-size="14" font-weight="400" fill="#217c72" text-anchor="start">教材示意 · Static teaching diagram</text>
<rect x="28" y="112" width="248" height="253" rx="12" fill="#fffdf7" stroke="#c4d5ca"/><text x="46" y="142" font-size="20" font-weight="600" fill="#263b38" text-anchor="start">原始完整姓名</text><text x="46" y="177" font-size="18" font-weight="400" fill="#263b38" text-anchor="start">··Maya Chen··</text><text x="46" y="209" font-size="18" font-weight="400" fill="#263b38" text-anchor="start">Maya ⇥ Chen</text><text x="46" y="241" font-size="18" font-weight="400" fill="#263b38" text-anchor="start">Lin··Wei</text><text x="46" y="273" font-size="18" font-weight="400" fill="#263b38" text-anchor="start">···</text><path d="M284,230 L319,230" stroke="#217c72" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="330" y="112" width="230" height="253" rx="12" fill="#e2f1eb" stroke="#c4d5ca"/><text x="348" y="142" font-size="20" font-weight="600" fill="#263b38" text-anchor="start">清理规则</text><text x="348" y="177" font-size="18" font-weight="400" fill="#263b38" text-anchor="start">1. 去首尾空白</text><text x="348" y="209" font-size="18" font-weight="400" fill="#263b38" text-anchor="start">2. 连续空白 → 1 空格</text><text x="348" y="241" font-size="18" font-weight="400" fill="#263b38" text-anchor="start">3. 空姓名 → 丢弃</text><text x="348" y="273" font-size="18" font-weight="400" fill="#263b38" text-anchor="start">4. 同姓名 → 合并</text><path d="M569,230 L605,230" stroke="#217c72" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="616" y="112" width="256" height="253" rx="12" fill="#fffdf7" stroke="#c4d5ca"/><text x="634" y="142" font-size="20" font-weight="600" fill="#263b38" text-anchor="start">去重并排序</text><text x="634" y="177" font-size="18" font-weight="400" fill="#263b38" text-anchor="start">人数: 2</text><text x="634" y="209" font-size="18" font-weight="400" fill="#263b38" text-anchor="start">Lin Wei</text><text x="634" y="241" font-size="18" font-weight="400" fill="#263b38" text-anchor="start">Maya Chen</text>
<text x="28" y="422" font-size="15" font-weight="400" fill="#263b38" text-anchor="start">· 表示空格；含空格姓名用 list 构造，不要 split 整份名单。</text>
</g></svg>

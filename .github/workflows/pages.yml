name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "lessons/**"
      - "docs/**"
      - "website/**"
      - "CONTRIBUTORS.md"
      - "scripts/build_website.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: website/requirements.txt

      - name: Install MkDocs
        run: pip install -r website/requirements.txt

      - name: Generate site from lessons
        run: python3 scripts/build_website.py

      - name: Build MkDocs
        working-directory: website
        run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

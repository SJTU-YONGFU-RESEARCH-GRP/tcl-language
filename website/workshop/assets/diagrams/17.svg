<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title desc"><title id="title">教学周期预算与路径耗时</title><desc id="desc">周期预算为 10 ns，data_a 延迟 8.2 留余量 1.8，data_b 延迟 10.8 超出 0.8，data_c 延迟 11.5 超出 1.5；筛选严格负 slack。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#167d8d"/></marker></defs><rect width="900" height="360" rx="16" fill="#f6f2e9"/><style>text{font-family:system-ui,sans-serif;fill:#24343b}.h{font-size:23px;font-weight:700}.t{font-size:17px}.s{font-size:15px}.b{fill:#e0f0ee;stroke:#167d8d;stroke-width:2}.o{fill:#fff0da;stroke:#c98225;stroke-width:2}.a{stroke:#167d8d;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style><text x="30" y="38" class="h">教学周期预算与路径耗时</text><text class="s" x="32" y="75">简化 setup：slack = 10 ns − delay；未包含真实 STA 全部因素</text><line x1="150" y1="105" x2="150" y2="270" stroke="#24343b"/><line x1="650" y1="92" x2="650" y2="278" stroke="#167d8d" stroke-dasharray="7 5"/><text class="s" x="606" y="91">10 ns 预算</text><text class="t" x="30" y="141">data_a</text><rect x="150" y="118" width="410" height="32" fill="#167d8d"/><text class="s" x="670" y="140">8.2 → +1.8（预算内）</text><text class="t" x="30" y="201">data_b</text><rect x="150" y="178" width="500" height="32" fill="#167d8d"/><rect x="650" y="178" width="40" height="32" fill="#c98225"/><text class="s" x="709" y="201">10.8 → −0.8</text><text class="t" x="30" y="261">data_c</text><rect x="150" y="238" width="500" height="32" fill="#167d8d"/><rect x="650" y="238" width="75" height="32" fill="#c98225"/><text class="s" x="739" y="261">11.5 → −1.5</text><text class="s" x="150" y="307">负 slack 结果：先 data_c（−1.5），再 data_b（−0.8）</text><text x="30" y="340" class="s">教材示意 · 运行后的真实数据请看页面结果视图</text></svg>
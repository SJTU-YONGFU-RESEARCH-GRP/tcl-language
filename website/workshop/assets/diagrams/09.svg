<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">从匹配区段得到捕获字段</title><desc id="desc">整行日志由时间、value 等号后的整数、status 等号后的候选状态组成。三个括号捕获组依次得到时间零九点十五、值二十三、状态 OK。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#276960"/></marker></defs><rect width="800" height="360" rx="16" fill="#faf7ef"/><g font-family="system-ui, sans-serif" fill="#243c38"><text x="28" y="36" font-size="21" font-weight="700">从匹配区段得到捕获字段</text><text x="33" y="86" font-size="16">^([0-9]{2}:[0-9]{2}) value=(-?[0-9]+) status=(OK|WARN|ERROR)$</text><rect x="33" y="115" width="152" height="54" rx="9" fill="#e3eeea" stroke="#a9c3b9"/><text x="54" y="150" font-size="24">09:15</text><text x="205" y="150" font-size="22">value=</text><rect x="287" y="115" width="89" height="54" rx="9" fill="#fff0d9" stroke="#a9c3b9"/><text x="310" y="150" font-size="24">23</text><text x="399" y="150" font-size="22">status=</text><rect x="493" y="115" width="119" height="54" rx="9" fill="#e3eeea" stroke="#a9c3b9"/><text x="528" y="150" font-size="24">OK</text><path d="M110 177 L110 227" stroke="#276960" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M333 177 L333 227" stroke="#276960" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M553 177 L553 227" stroke="#276960" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="33" y="238" width="152" height="57" rx="9" fill="#e3eeea" stroke="#a9c3b9"/><text x="53" y="273" font-size="16">time = 09:15</text><rect x="260" y="238" width="154" height="57" rx="9" fill="#fff0d9" stroke="#a9c3b9"/><text x="277" y="273" font-size="16">value = 23</text><rect x="477" y="238" width="153" height="57" rx="9" fill="#e3eeea" stroke="#a9c3b9"/><text x="494" y="273" font-size="16">status = OK</text><text x="33" y="332" font-size="16">只有 regexp 返回 1 才读取捕获组；外形匹配不等于时间或数值业务合法。</text></g></svg>

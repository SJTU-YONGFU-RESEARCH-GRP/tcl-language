<text x="28" y="73" font-size="14" font-weight="400" fill="#217c72" text-anchor="start">教材示意 · Static teaching diagram</text>
<rect x="28" y="109" width="404" height="270" rx="12" fill="#fffdf7" stroke="#c4d5ca"/><text x="47" y="139" font-size="20" font-weight="600" fill="#263b38" text-anchor="start">原始教学路径 / ns</text><text x="47" y="173" font-size="17" font-weight="400" fill="#263b38" text-anchor="start">path</text><text x="197" y="173" font-size="17" font-weight="400" fill="#263b38" text-anchor="start">delay</text><text x="314" y="173" font-size="17" font-weight="400" fill="#263b38" text-anchor="start">slack</text><text x="47" y="214" font-size="17" font-weight="400" fill="#263b38" text-anchor="start">P_data</text><text x="197" y="214" font-size="17" font-weight="400" fill="#263b38" text-anchor="start">9.25</text><text x="314" y="214" font-size="17" font-weight="400" fill="#263b38" text-anchor="start">−1.25</text><text x="47" y="252" font-size="17" font-weight="400" fill="#263b38" text-anchor="start">P_ok</text><text x="197" y="252" font-size="17" font-weight="400" fill="#263b38" text-anchor="start">7.00</text><text x="314" y="252" font-size="17" font-weight="400" fill="#263b38" text-anchor="start">1.00</text><text x="47" y="290" font-size="17" font-weight="400" fill="#263b38" text-anchor="start">P_ctrl</text><text x="197" y="290" font-size="17" font-weight="400" fill="#263b38" text-anchor="start">8.20</text><text x="314" y="290" font-size="17" font-weight="400" fill="#263b38" text-anchor="start">−0.20</text><text x="47" y="328" font-size="17" font-weight="400" fill="#263b38" text-anchor="start">P_edge</text><text x="197" y="328" font-size="17" font-weight="400" fill="#263b38" text-anchor="start">8.00</text><text x="314" y="328" font-size="17" font-weight="400" fill="#263b38" text-anchor="start">0.00</text><path d="M442,247 L480,247" stroke="#217c72" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="492" y="109" width="380" height="270" rx="12" fill="#e2f1eb" stroke="#c4d5ca"/><text x="514" y="141" font-size="19" font-weight="600" fill="#263b38" text-anchor="start">筛选 slack &lt; 0，再升序排序</text><text x="514" y="182" font-size="17" font-weight="400" fill="#263b38" text-anchor="start">P_data  −1.25 · 更严重</text><rect x="514" y="195" width="305" height="24" rx="4" fill="#ae5f23"/><text x="514" y="259" font-size="17" font-weight="400" fill="#263b38" text-anchor="start">P_ctrl  −0.20</text><rect x="514" y="273" width="49" height="24" rx="4" fill="#217c72"/><text x="514" y="348" font-size="17" font-weight="400" fill="#263b38" text-anchor="start">P_ok 和 P_edge 未入选</text>

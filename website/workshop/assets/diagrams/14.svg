<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title desc"><title id="title">入口、参数、配置与工具脚本</title><desc id="desc">argv 指定数据文件，入口 source settings.tcl 取得标题与精度，source tools.tcl 定义计算过程；读取数据后生成报告。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#167d8d"/></marker></defs><rect width="900" height="360" rx="16" fill="#f6f2e9"/><style>text{font-family:system-ui,sans-serif;fill:#24343b}.h{font-size:23px;font-weight:700}.t{font-size:17px}.s{font-size:15px}.b{fill:#e0f0ee;stroke:#167d8d;stroke-width:2}.o{fill:#fff0da;stroke:#c98225;stroke-width:2}.a{stroke:#167d8d;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style><text x="30" y="38" class="h">入口、参数、配置与工具脚本</text><rect class="b" x="30" y="75" width="230" height="80" rx="10"/><text class="t" x="50" y="106">argv：readings.txt</text><text class="s" x="50" y="134">argc = 1</text><rect class="o" x="30" y="210" width="230" height="85" rx="10"/><text class="t" x="50" y="240">settings.tcl</text><text class="s" x="50" y="269">title、digits（可信配置）</text><path class="a" d="M270 114L340 175"/><path class="a" d="M270 253L340 205"/><rect class="b" x="355" y="131" width="190" height="112" rx="10"/><text class="t" x="385" y="166">main.tcl</text><text class="s" x="377" y="197">校验 → 协调</text><rect class="b" x="625" y="75" width="240" height="80" rx="10"/><text class="t" x="644" y="107">tools.tcl</text><text class="s" x="644" y="135">formatAverage 过程</text><path class="a" d="M550 163L612 120"/><rect class="o" x="625" y="215" width="240" height="80" rx="10"/><text class="t" x="645" y="248">输出报告</text><text class="s" x="645" y="276">测量日报 · 平均值 2.50</text><path class="a" d="M550 213L612 253"/><text x="30" y="340" class="s">教材示意 · 运行后的真实数据请看页面结果视图</text></svg>
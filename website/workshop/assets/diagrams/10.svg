<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title desc"><title id="title">输入参数 → 过程 → 返回值</title><desc id="desc">数量 2、单价 15、运费 5、折扣 0.8 传入 orderFee，局部商品金额为 30，返回 29；外部 subtotal 为 88。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#167d8d"/></marker></defs><rect width="900" height="360" rx="16" fill="#f6f2e9"/><style>text{font-family:system-ui,sans-serif;fill:#24343b}.h{font-size:23px;font-weight:700}.t{font-size:17px}.s{font-size:15px}.b{fill:#e0f0ee;stroke:#167d8d;stroke-width:2}.o{fill:#fff0da;stroke:#c98225;stroke-width:2}.a{stroke:#167d8d;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style><text x="30" y="38" class="h">输入参数 → 过程 → 返回值</text><rect class="b" x="30" y="72" width="230" height="185" rx="10"/><text class="t" x="48" y="105">实参：2、15、5、0.8</text><text class="s" x="48" y="145">count = 2</text><text class="s" x="48" y="175">price = 15</text><text class="s" x="48" y="205">delivery = 5 · rate = 0.8</text><path class="a" d="M270 162H316"/><rect class="b" x="330" y="72" width="270" height="185" rx="10"/><text class="t" x="350" y="105">orderFee 的局部空间</text><text class="s" x="350" y="145">subtotal = 2 × 15 = 30</text><text class="s" x="350" y="185">return 30 × 0.8 + 5</text><path class="a" d="M610 162H656"/><rect class="o" x="670" y="106" width="200" height="110" rx="10"/><text class="t" x="692" y="142">返回值：29</text><text class="s" x="692" y="178">交给调用者继续使用</text><text class="t" x="330" y="296">外部 subtotal = 88；局部计算不改写它</text><text x="30" y="340" class="s">教材示意 · 运行后的真实数据请看页面结果视图</text></svg>
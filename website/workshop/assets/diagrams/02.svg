<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">数据进入变量，表达式得到金额</title><desc id="desc">三个变量价格十八、数量三、运费六参与乘加表达式，金额六十被保存到 total。改变数量后需重新求值。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#276960"/></marker></defs><rect width="800" height="360" rx="16" fill="#faf7ef"/><g font-family="system-ui, sans-serif" fill="#243c38"><text x="28" y="36" font-size="21" font-weight="700">数据进入变量，表达式得到金额</text><rect x="35" y="72" width="240" height="162" rx="9" fill="#e3eeea" stroke="#a9c3b9"/><text x="54" y="106" font-size="17">变量名           当前值</text><text x="54" y="144" font-size="17">price                 18</text><text x="54" y="178" font-size="17">quantity             3</text><text x="54" y="212" font-size="17">shipping             6</text><rect x="352" y="95" width="396" height="109" rx="9" fill="#e3eeea" stroke="#a9c3b9"/><text x="375" y="131" font-size="17">expr {$price * $quantity</text><text x="375" y="162" font-size="17">      + $shipping}</text><path d="M280 149 L342 149" stroke="#276960" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M550 212 L550 262" stroke="#276960" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="403" y="268" width="291" height="49" rx="9" fill="#fff0d9" stroke="#a9c3b9"/><text x="429" y="299" font-size="17">total = 18 × 3 + 6 = 60</text><text x="39" y="324" font-size="16">数量变成 4 → 再计算 → total = 78</text></g></svg>

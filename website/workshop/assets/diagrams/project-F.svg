<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="900" height="450" role="img" aria-labelledby="title desc">
<title id="title">文件与配置驱动的报告流程</title><desc id="desc">入口从 argv 读取配置路径，加载受信任配置和工具脚本，再读取输入、解析并筛选，将摘要和错误写入两个独立文件。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#217c72"/></marker></defs>
<rect width="900" height="450" rx="18" fill="#f8f5ed"/>
<g font-family="system-ui, 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif">
<text x="28" y="43" font-size="25" font-weight="650" fill="#263b38" text-anchor="start">项目 F · 文件与配置驱动的报告流程</text>
<text x="28" y="73" font-size="14" font-weight="400" fill="#217c72" text-anchor="start">教材示意 · Static teaching diagram</text>
<rect x="28" y="107" width="220" height="105" rx="12" fill="#e2f1eb" stroke="#c4d5ca"/><text x="46" y="137" font-size="20" font-weight="600" fill="#263b38" text-anchor="start">受信任配置</text><text x="46" y="172" font-size="18" font-weight="400" fill="#263b38" text-anchor="start">minimum = 10</text><rect x="28" y="232" width="220" height="105" rx="12" fill="#fffdf7" stroke="#c4d5ca"/><text x="46" y="262" font-size="20" font-weight="600" fill="#263b38" text-anchor="start">工具脚本</text><text x="46" y="297" font-size="18" font-weight="400" fill="#263b38" text-anchor="start">read / parse / write</text><path d="M258,160 L294,187" stroke="#217c72" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M258,284 L294,244" stroke="#217c72" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="307" y="157" width="222" height="122" rx="12" fill="#e2f1eb" stroke="#c4d5ca"/><text x="325" y="187" font-size="20" font-weight="600" fill="#263b38" text-anchor="start">入口脚本</text><text x="325" y="222" font-size="18" font-weight="400" fill="#263b38" text-anchor="start">source → 验证配置</text><text x="325" y="254" font-size="18" font-weight="400" fill="#263b38" text-anchor="start">参数 0: config.tcl</text><path d="M539,215 L575,215" stroke="#217c72" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="588" y="157" width="284" height="122" rx="12" fill="#fffdf7" stroke="#c4d5ca"/><text x="606" y="187" font-size="20" font-weight="600" fill="#263b38" text-anchor="start">输入 → 解析与统计</text><text x="606" y="222" font-size="18" font-weight="400" fill="#263b38" text-anchor="start">readings.csv</text><text x="606" y="254" font-size="18" font-weight="400" fill="#263b38" text-anchor="start">合法记录 / 选中记录 / 坏行</text><path d="M725,289 L725,314 L470,314 L470,333" stroke="#217c72" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M725,289 L725,333" stroke="#217c72" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="333" y="343" width="256" height="45" rx="12" fill="#e2f1eb" stroke="#c4d5ca"/><text x="349" y="372" font-size="17" font-weight="400" fill="#263b38" text-anchor="start">summary.txt · 数据摘要</text><rect x="616" y="343" width="256" height="45" rx="12" fill="#ffecd8" stroke="#c4d5ca"/><text x="632" y="372" font-size="17" font-weight="400" fill="#263b38" text-anchor="start">errors.txt · 错误记录</text>
<text x="28" y="422" font-size="15" font-weight="400" fill="#263b38" text-anchor="start">浏览器里使用虚拟文件；本地运行在当前目录创建真实文件。</text>
</g></svg>

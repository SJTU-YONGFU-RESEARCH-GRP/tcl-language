<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">预算从高门槛开始判断</title><desc id="desc">预算七十五先比较是否达到九十，否；再比较是否达到六十，是；选中标准包，后续分支不再执行。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#276960"/></marker></defs><rect width="800" height="360" rx="16" fill="#faf7ef"/><g font-family="system-ui, sans-serif" fill="#243c38"><text x="28" y="36" font-size="21" font-weight="700">预算从高门槛开始判断</text><rect x="30" y="93" width="156" height="60" rx="9" fill="#e3eeea" stroke="#a9c3b9"/><text x="50" y="129" font-size="17">budget = 75</text><path d="M193 123 L244 123" stroke="#276960" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="251" y="84" width="209" height="79" rx="9" fill="#e3eeea" stroke="#a9c3b9"/><text x="275" y="116" font-size="17">75 &gt;= 90 ?</text><text x="276" y="144" font-size="15">否 → 继续</text><path d="M352 171 L352 216" stroke="#276960" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="251" y="222" width="209" height="76" rx="9" fill="#e3eeea" stroke="#a9c3b9"/><text x="275" y="251" font-size="17">75 &gt;= 60 ?</text><text x="276" y="280" font-size="15">是 → 选中</text><path d="M468 260 L523 260" stroke="#276960" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="535" y="225" width="219" height="70" rx="9" fill="#fff0d9" stroke="#a9c3b9"/><text x="560" y="268" font-size="17">标准包（60 元）</text><text x="34" y="331" font-size="16">只执行第一个成立的分支；60 元边界属于 &gt;= 60。</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">分组与替换是两件事</title><desc id="desc">同样含有 name 标记的文字，双引号分组得到替换后的姓名，花括号分组保留原文。方括号执行 expr 并插入返回值三十六。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#276960"/></marker></defs><rect width="800" height="360" rx="16" fill="#faf7ef"/><g font-family="system-ui, sans-serif" fill="#243c38"><text x="28" y="36" font-size="21" font-weight="700">分组与替换是两件事</text><rect x="30" y="69" width="337" height="58" rx="9" fill="#e3eeea" stroke="#a9c3b9"/><text x="47" y="105" font-size="17">&quot;欢迎：$name&quot;</text><path d="M376 99 L433 99" stroke="#276960" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="444" y="69" width="322" height="58" rx="9" fill="#e3eeea" stroke="#a9c3b9"/><text x="467" y="105" font-size="17">欢迎：林 雨</text><rect x="30" y="145" width="337" height="58" rx="9" fill="#e3eeea" stroke="#a9c3b9"/><text x="47" y="181" font-size="17">{欢迎：$name}</text><path d="M376 175 L433 175" stroke="#276960" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="444" y="145" width="322" height="58" rx="9" fill="#fff0d9" stroke="#a9c3b9"/><text x="467" y="181" font-size="17">欢迎：$name（原文）</text><rect x="30" y="221" width="337" height="58" rx="9" fill="#e3eeea" stroke="#a9c3b9"/><text x="47" y="257" font-size="17">[expr {12 * 3}]</text><path d="M376 251 L433 251" stroke="#276960" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="444" y="221" width="322" height="58" rx="9" fill="#e3eeea" stroke="#a9c3b9"/><text x="467" y="257" font-size="17">36（命令返回值）</text><text x="31" y="326" font-size="16">教材示意：花括号的反斜杠换行仍会折叠；expr 可继续解释其参数。</text></g></svg>

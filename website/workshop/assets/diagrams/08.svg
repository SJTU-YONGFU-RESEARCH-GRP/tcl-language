<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">字典值与数组变量的两种形态</title><desc id="desc">左侧字典是保存在 device 变量中的值，右侧数组 readings 包含 north 和 south 两个元素。get 读取值，set 修改变量名；两种容器不能直接混用命令。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#276960"/></marker></defs><rect width="800" height="360" rx="16" fill="#faf7ef"/><g font-family="system-ui, sans-serif" fill="#243c38"><text x="28" y="36" font-size="21" font-weight="700">字典值与数组变量的两种形态</text><rect x="32" y="73" width="344" height="218" rx="9" fill="#e3eeea" stroke="#a9c3b9"/><text x="50" y="107" font-size="20">字典：device 保存一个值</text><text x="50" y="148" font-size="17">id              LAB-07</text><text x="50" y="183" font-size="17">location     北区 台位</text><text x="50" y="218" font-size="17">status       ready</text><text x="50" y="262" font-size="16">dict get $device status</text><rect x="422" y="73" width="344" height="218" rx="9" fill="#fff0d9" stroke="#a9c3b9"/><text x="440" y="107" font-size="19">数组：readings 是变量容器</text><text x="440" y="148" font-size="17">readings(north)     22</text><text x="440" y="183" font-size="17">readings(south)     24</text><text x="440" y="218" font-size="16">$readings 本身不是标量</text><text x="440" y="262" font-size="16">array get readings → 键值列表</text><text x="34" y="329" font-size="16">修改字典：dict set device status busy；修改数组：set readings(north) 23</text></g></svg>
